sources:
  - name: "Finding Crash-Consistency Bugs with Bounded Black-Box Crash Testing (Mohan et al., OSDI 2018)"
    url: "https://www.cs.utexas.edu/~vijay/papers/osdi18-crashmonkey.pdf"
    type: research-paper
    accessed: "2026-11-07"
    sections_used:
      - "§4.1 Overview, crash points (persisted objects must survive), p.6"
      - "§4.2 Bounds used by B3 (overlapping file ranges, initial state), p.6"
      - "§4.3 Fine-grained correctness checking, p.6"
      - "§4.4 Limitations (sound but incomplete; no mid-operation crash or IO reordering), p.6"
      - "§5.1 CrashMonkey (crash state, oracle, AutoChecker, fsck only if unmountable, read/write checks, stronger-than-POSIX guarantees), pp.7-8"
      - "Read as paper-reader page images (page-004..page-007)"
  - name: "Linux man-pages fsync(2)"
    url: "https://man7.org/linux/man-pages/man2/fsync.2.html"
    type: official-manual
    accessed: "2026-11-07"
    sections_used:
      - "DESCRIPTION (in-core data flush; directory entry needs directory fsync)"
      - "ERRORS (EIO, ENOSPC)"
      - "Linux man-pages 6.19, page dated 2026-02-08; man7.org has no immutable URL"
  - name: "Linux man-pages rename(2)"
