sources:
  - name: Invariant-Based Automatic Testing of Modern Web Applications (Mesbah, van Deursen, Roest, TSE 2012)
    url: https://people.ece.ubc.ca/amesbah/resources/papers/tse11.pdf
    type: research-paper
    accessed: '2026-11-09'
    sections_used:
      - p.38 Algorithm 2 invariants checked on each new state
      - p.39 candidate elements and exclusion of destructive elements
      - p.40 comparators too permissive; input values stored with the clickable; element resolution not guaranteed
      - p.41 generic DOM invariants and Table 2 invariant forms with preconditions
      - p.42 JavaScript-variable invariants, dead clickables, Back button, Source-Action-Target
      - p.43 saved failing path; running tests in another browser
      - p.44 Table 3 OnUrlLoadPlugin back-end reset; failure report contents
      - p.46 TaskFreak growing DOM tree
      - p.47 HitList exclusions and add-once crawl condition
      - p.48 TUDU silent JavaScript faults, depth 3, SQL reset
      - p.50 smoke test; choosing application invariants
  - name: Regression Testing Ajax Applications - Coping with Dynamism (Roest, Mesbah, van Deursen, ICST 2010)
    url: https://people.ece.ubc.ca/amesbah/resources/papers/icst10.pdf
    type: research-paper
    accessed: '2026-11-09'
    sections_used:
      - pp.128-129 sources of nondeterminism
      - p.129 positional locators select a similar element
      - pp.129-131 comparator pipeline, preconditions, templates, stripped-DOM hash, resolver
      - p.132 failure report with stripped and full DOMs
      - pp.133-134 HitList leading-zero bug hidden by the generic Table comparator; wrong transitions without the resolver
      - p.134 drift between crawl and test; Google Reader attribute differences
      - p.135 settle delay; clean-up plugin and database restore
  - name: Crawling Ajax-Based Web Applications through Dynamic Analysis of User Interface State Changes (Mesbah, van Deursen, Lenselink, TWEB 2012)
    url: https://doi.org/10.1145/2109205.2109208
    type: research-paper
    accessed: '2026-11-09'
    sections_used:
      - p.5 addEventListener handlers invisible to DOM inspection
      - pp.8-9 Definition 2 transition criterion, candidates from the DOM diff, global deduplication
      - pp.10-11 reload and replay of the recorded path
      - pp.18-20 Table II depth 1 to 2 state growth
      - pp.18-19 no strict notion of correct equivalence
      - p.19 repeated-click elements missed; not all states reached
      - pp.21, 27 completion-flag settle
      - p.24 changing banner
      - p.26 cookies broke reset; an instance of the state machine
  - name: 'BLeak: Automatically Debugging Memory Leaks in Web Applications (Vilk, Berger, PLDI 2018, extended version)'
